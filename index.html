<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ai Image Generator </title>

    <!-- Link CSS File -->
     <link rel="stylesheet" href="assets/css/style.css">
    <!--  -->

    <!-- Fontawsome CDN File -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--  -->

    <!-- Link Favicon Link -->
     <link rel="shortcut icon" href="assets/images/robo logo.jpg" type="image/x-icon">
    <!--  -->

</head>
<body>

    
    
    <section class="image-generator" style="background-image: url(assets/images/bg\ imageyu.jpeg);">
        <div class="content">
            <h1>Ai Image Generator tool Javascript</h1>
            <p>Convert your text into an image within a second using this Javacript-powered Ai Image Generated tool.</p>
            <form action="#" class="generate-form">
                <input type="text" class="prompt-input" placeholder="Describe what you want to see" required>
                <div class="controls">
                    <select class="image-quantity">
                        <option value="1">1 Image</option>
                        <option value="2">2 Image</option>
                        <option value="3">3 Image</option>
                        <option value="4" selected>4 Image</option>
                    </select>
                    <button type="submit" class="generate-btn">Generate</button>
                </div>
            </form>
        </div>
    </section>
    
    
    <!-- Image Gallery Section Start Here -->

    <section class="image-gallery">

        <div class="img-card">
            <img src="assets/images/img-1.jpg" alt="image">
            <a href="#" class="download-btn">
                <img src="assets/images/download.svg" alt="Download-BtnImage">
            </a>
        </div>
        <div class="img-card">
            <img src="assets/images/img-2.jpg" alt="image">
            <a href="#" class="download-btn">
                <img src="assets/images/download.svg" alt="Download-BtnImage">
            </a>
        </div>
        <div class="img-card">
            <img src="assets/images/img-3.jpg" alt="image">
            <a href="#" class="download-btn">
                <img src="assets/images/download.svg" alt="Download-BtnImage">
            </a>
        </div>
        <div class="img-card">
            <img src="assets/images/img-4.jpg" alt="image">
            <a href="#" class="download-btn">
                <img src="assets/images/download.svg" alt="Download-BtnImage">
            </a>
        </div>

    </section>










    <!-- Link JavaScript File -->
     <script src="assets/js/script.js" defer></script>
    <!--  -->

</body>
</html>
